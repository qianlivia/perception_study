name: Deploy GitHub Pages Lightweight

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Strict Minimal File Matrix)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html

            # --- Files for fe_03_01596_319.92 ---
            data_study_opus/gt/fe_03_01596_319.92.opus
            data_study/gt_transcripts/fe_03_01596_319.92.json
            data_study_opus/b_b/fe_03_01596_319.92.opus
            data_study/b_b_transcripts/fe_03_01596_319.92.json
            data_study_opus/c_b/fe_03_01596_319.92.opus
            data_study/c_b_transcripts/fe_03_01596_319.92.json
            data_study_opus/random_same_lexical_set3/fe_03_01596_319.92.opus
            data_study/random_same_lexical_transcripts_set3/fe_03_01596_319.92.json
            data_study_opus/random_set4/fe_03_01596_319.92.opus
            data_study/random_transcripts_set4/fe_03_01596_319.92.json

            # --- Files for fe_03_03206_178.3 ---
            data_study_opus/gt/fe_03_03206_178.3.opus
            data_study/gt_transcripts/fe_03_03206_178.3.json
            data_study_opus/b_b/fe_03_03206_178.3.opus
            data_study/b_b_transcripts/fe_03_03206_178.3.json
            data_study_opus/c_b/fe_03_03206_178.3.opus
            data_study/c_b_transcripts/fe_03_03206_178.3.json
            data_study_opus/random_same_lexical_set2/fe_03_03206_178.3.opus
            data_study/random_same_lexical_transcripts_set2/fe_03_03206_178.3.json
            data_study_opus/random/fe_03_03206_178.3.opus
            data_study/random_transcripts/fe_03_03206_178.3.json

            # --- Files for fe_03_00159_415.51 ---
            data_study_opus/gt/fe_03_00159_415.51.opus
            data_study/gt_transcripts/fe_03_00159_415.51.json
            data_study_opus/b_b/fe_03_00159_415.51.opus
            data_study/b_b_transcripts/fe_03_00159_415.51.json
            data_study_opus/c_b/fe_03_00159_415.51.opus
            data_study/c_b_transcripts/fe_03_00159_415.51.json
            data_study_opus/random_same_lexical_set2/fe_03_00159_415.51.opus
            data_study/random_same_lexical_transcripts_set2/fe_03_00159_415.51.json
            data_study_opus/random_set3/fe_03_00159_415.51.opus
            data_study/random_transcripts_set3/fe_03_00159_415.51.json

          sparse-checkout-cone-mode: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
