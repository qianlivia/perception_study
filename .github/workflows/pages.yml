name: Deploy GitHub Pages Lightweight

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Targeted Folders Only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            gt/
            b_b/
            c_b/
            random/
            random_same_lexical/
            gt_transcripts/
            b_b_transcripts/
            c_b_transcripts/
            random_transcripts/
            random_same_lexical_transcripts/
          sparse-checkout-cone-mode: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
